[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import order)
    "B",    # flake8-bugbear (common bug patterns)
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter; long UI strings are intentional
    "SIM108", # ternary style — readability choice in UI code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]  # tests: assertions and simple style are fine

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
# The app modules use dual import paths (package + script); check them as-is.
files = ["mobile_money_system"]
exclude = ["__pycache__"]
